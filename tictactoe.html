<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ایکس‌اُ | بازی دو نفره</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080d;
    --bg2:#0d0d16;
    --x-color:#5b8def;
    --x-glow:rgba(91,141,239,.55);
    --o-color:#ff5d73;
    --o-glow:rgba(255,93,115,.55);
    --amb-blue:#5b8def;
    --amb-pink:#f472b6;
    --amb-purple:#9b6bff;
    --card:#101018;
    --card-border:rgba(255,255,255,.07);
    --text:#f2f2f7;
    --text-dim:#8a8a9a;
    --radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Vazirmatn',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* ---------- background ambience ---------- */
  .bg-glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 55% 40% at 18% 12%, rgba(91,141,239,.10), transparent 60%),
      radial-gradient(ellipse 50% 40% at 85% 20%, rgba(244,114,182,.09), transparent 60%),
      radial-gradient(ellipse 60% 45% at 50% 95%, rgba(155,107,255,.10), transparent 60%);
  }
  .bg-decor{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .drift{
    position:absolute;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    opacity:.09;
    filter:blur(.3px);
    animation:driftUp linear infinite;
    user-select:none;
  }
  @keyframes driftUp{
    0%{transform:translateY(0) rotate(0deg);}
    100%{transform:translateY(-120vh) rotate(360deg);}
  }

  /* ---------- layout ---------- */
  .screen{
    position:relative; z-index:2;
    width:100%; max-width:460px;
    padding:28px 20px 34px;
    display:none;
    flex-direction:column;
    align-items:center;
    animation:fadeIn .5s ease;
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- home screen ---------- */
  .logo{
    font-family:'Space Grotesk',sans-serif;
    font-size:52px;
    font-weight:700;
    letter-spacing:1px;
    margin:6px 0 4px;
    display:flex;
    gap:2px;
  }
  .logo span.x{color:var(--x-color); text-shadow:0 0 24px var(--x-glow);}
  .logo span.o{color:var(--o-color); text-shadow:0 0 24px var(--o-glow);}
  .tagline{color:var(--text-dim); font-size:14px; margin-bottom:26px;}

  .feature-list{
    width:100%;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:26px;
    display:flex; flex-direction:column; gap:10px;
  }
  .feature-list .row{display:flex; align-items:center; gap:10px; font-size:13.5px; color:#cfcfe0;}
  .feature-list .row b{color:var(--text); font-weight:500;}

  .btn{
    border:none; cursor:pointer;
    font-family:'Vazirmatn',sans-serif;
    border-radius:16px;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{
    width:100%;
    padding:16px;
    font-size:17px;
    font-weight:700;
    color:#08080d;
    background:linear-gradient(135deg, var(--x-color), var(--o-color));
    box-shadow:0 8px 30px -8px rgba(155,107,255,.55);
  }
  .btn-primary:hover{box-shadow:0 10px 34px -6px rgba(155,107,255,.75);}

  .diff-list{
    width:100%; display:flex; flex-direction:column; gap:10px; margin-bottom:6px;
  }
  .diff-btn{
    width:100%; display:flex; align-items:center; justify-content:center;
    padding:15px 18px; border-radius:16px; cursor:pointer;
    background:var(--card); border:1px solid var(--card-border);
    font-family:'Vazirmatn',sans-serif; color:var(--text);
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .diff-btn:active{transform:scale(.96);}
  .diff-btn:hover{border-color:rgba(255,255,255,.22); box-shadow:0 8px 24px -10px rgba(155,107,255,.5);}
  .diff-name{font-size:15.5px; font-weight:700;}
  .diff-sub{
    font-family:'Space Grotesk',sans-serif; font-size:12.5px; color:var(--text-dim);
    background:rgba(255,255,255,.05); padding:3px 10px; border-radius:20px;
  }

  .kbd-hint{
    margin-top:20px; font-size:12px; color:var(--text-dim);
    display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;
  }
  kbd{
    background:#1a1a26; border:1px solid #2b2b3d; border-radius:6px;
    padding:2px 7px; font-family:'Space Grotesk',sans-serif; font-size:11px; color:#dcdcf0;
  }

  /* ---------- game screen ---------- */
  .scoreboard{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .score-card{
    flex:1; background:var(--card); border:1px solid var(--card-border);
    border-radius:16px; padding:12px 10px; text-align:center;
    transition:box-shadow .25s ease, border-color .25s ease;
  }
  .score-card .p-label{font-size:12px; color:var(--text-dim); margin-bottom:4px;}
  .score-card .p-score{font-family:'Space Grotesk',sans-serif; font-size:30px; font-weight:700;}
  .score-card.turn-x{border-color:rgba(91,141,239,.6); box-shadow:0 0 22px -4px var(--x-glow);}
  .score-card.turn-o{border-color:rgba(255,93,115,.6); box-shadow:0 0 22px -4px var(--o-glow);}
  #score-x .p-score{color:var(--x-color);}
  #score-o .p-score{color:var(--o-color);}
  .vs{
    width:34px; text-align:center; color:var(--text-dim); font-size:12px; font-weight:700;
    font-family:'Space Grotesk',sans-serif;
  }

  .turn-indicator{
    font-size:13px; color:var(--text-dim); margin-bottom:14px; height:16px;
  }
  .turn-indicator b.x{color:var(--x-color);}
  .turn-indicator b.o{color:var(--o-color);}

  .board{
    direction:ltr;
    display:grid; gap:8px;
    width:100%; max-width:min(92vw, 420px); aspect-ratio:1/1;
    margin-bottom:18px;
  }
  .cell{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-size:44px; font-weight:700;
    cursor:pointer; user-select:none;
    position:relative;
    min-width:0; min-height:0;
    transition:border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .cell:active{transform:scale(.95);}
  .cell.cursor{
    border-color:rgba(255,255,255,.35);
    box-shadow:0 0 0 2px rgba(255,255,255,.12) inset;
  }
  .cell .mark{animation:pop .22s ease;}
  @keyframes pop{from{transform:scale(.3); opacity:0;} to{transform:scale(1); opacity:1;}}
  .cell.x .mark{color:var(--x-color); text-shadow:0 0 18px var(--x-glow);}
  .cell.o .mark{color:var(--o-color); text-shadow:0 0 18px var(--o-glow);}
  .cell.win{background:#15151f; border-color:rgba(255,255,255,.3); animation:winPulse 1s ease infinite;}
  @keyframes winPulse{0%,100%{box-shadow:0 0 0 rgba(255,255,255,0);} 50%{box-shadow:0 0 26px rgba(255,255,255,.18);}}

  .controls{
    width:100%; display:flex; gap:10px; margin-bottom:8px;
  }
  .btn-secondary{
    flex:1; padding:12px; font-size:13.5px; font-weight:500;
    background:var(--card); color:var(--text); border:1px solid var(--card-border);
  }
  .btn-secondary:hover{border-color:rgba(255,255,255,.2);}
  .btn-secondary.danger{color:#ff8a8a;}

  .kbd-hint-game{
    margin-top:14px; font-size:11.5px; color:var(--text-dim);
    display:flex; flex-wrap:wrap; justify-content:center; gap:5px 8px; text-align:center;
  }

  .round-toast{
    position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-30px);
    z-index:20; background:var(--card); border:1px solid var(--card-border);
    padding:10px 20px; border-radius:14px; font-size:14px; font-weight:500;
    opacity:0; pointer-events:none; transition:all .35s ease;
    box-shadow:0 10px 30px -6px rgba(0,0,0,.5);
  }
  .round-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- match overlay ---------- */
  .overlay{
    position:fixed; inset:0; z-index:30;
    background:rgba(5,5,9,.82); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center;
    animation:fadeIn .3s ease;
  }
  .overlay.active{display:flex;}
  .overlay-card{
    text-align:center; padding:36px 30px; width:88%; max-width:340px;
    background:var(--card); border:1px solid var(--card-border);
    border-radius:26px;
  }
  .trophy{font-size:64px; margin-bottom:6px; animation:trophyPop .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes trophyPop{0%{transform:scale(0) rotate(-20deg); opacity:0;} 100%{transform:scale(1) rotate(0); opacity:1;}}
  .overlay-title{font-size:22px; font-weight:700; margin-bottom:6px;}
  .overlay-title b.x{color:var(--x-color);}
  .overlay-title b.o{color:var(--o-color);}
  .overlay-sub{color:var(--text-dim); font-size:13px; margin-bottom:22px;}

  .board.size-3 .cell{font-size:44px; border-radius:16px;}
  .board.size-6 .cell{font-size:22px; border-radius:10px;}
  .board.size-12 .cell{font-size:12px; border-radius:6px;}
  .board.size-6{gap:6px;}
  .board.size-12{gap:3px;}

  @media (max-width:380px){
    .logo{font-size:42px;}
    .board.size-3 .cell{font-size:36px;}
    .board.size-6 .cell{font-size:18px;}
    .board.size-12 .cell{font-size:9px;}
  }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-decor" id="bgDecor"></div>

<!-- HOME SCREEN -->
<div class="screen active" id="home-screen">
  <div class="logo"><span class="x">X</span><span class="o">O</span></div>
  <div class="tagline">نبرد دو نفره‌ی X و O، همین حالا شروع می‌شه</div>

  <div class="diff-list">
    <button class="diff-btn" data-size="3" data-win="3">
      <span class="diff-name">🟢 آسان</span>
    </button>
    <button class="diff-btn" data-size="6" data-win="4">
      <span class="diff-name">🟡 متوسط</span>
    </button>
    <button class="diff-btn" data-size="12" data-win="5">
      <span class="diff-name">🔴 سخت</span>
    </button>
  </div>

  <div class="kbd-hint">
    <div>🚀 هر خونه یه فرصته، از دستش نده</div>
    <div>⚡ سریع‌تر از حریف باش: یه ضربه با <kbd>X</kbd> یا <kbd>O</kbd> کافیه</div>
  </div>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="game-screen">
  <div class="scoreboard">
    <div class="score-card" id="score-x">
      <div class="p-label">بازیکن X</div>
      <div class="p-score" id="scoreXVal">0</div>
    </div>
    <div class="vs">VS</div>
    <div class="score-card" id="score-o">
      <div class="p-label">بازیکن O</div>
      <div class="p-score" id="scoreOVal">0</div>
    </div>
  </div>

  <div class="turn-indicator" id="turnIndicator">نوبت <b class="x">X</b></div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="btn btn-secondary" id="restartBtn">🔄 دور جدید</button>
    <button class="btn btn-secondary danger" id="endBtn">⏹ اتمام بازی</button>
  </div>

  <div class="kbd-hint-game">
    <span>🔥 دستاتو گرم کن، وقت نبرد رسیده!</span>
  </div>
</div>

<div class="round-toast" id="roundToast"></div>

<!-- MATCH WIN OVERLAY -->
<div class="overlay" id="matchOverlay">
  <div class="overlay-card">
    <div class="trophy">🏆</div>
    <div class="overlay-title" id="matchTitle">بازیکن <b class="x">X</b> قهرمان شد!</div>
    <div class="overlay-sub">با رسیدن به ۳ برد، این دور بازی به پایان رسید.</div>
    <button class="btn btn-primary" id="homeBtn">بازگشت به خانه</button>
  </div>
</div>

<script>
/* ---------------- background decor ---------------- */
(function(){
  const wrap = document.getElementById('bgDecor');
  const colors = ['var(--amb-blue)','var(--amb-pink)','var(--amb-purple)'];
  const symbols = ['X','O'];
  for(let i=0;i<22;i++){
    const el = document.createElement('div');
    el.className = 'drift';
    el.textContent = symbols[Math.floor(Math.random()*2)];
    el.style.left = Math.random()*100+'vw';
    el.style.top = (100+Math.random()*30)+'vh';
    el.style.fontSize = (14+Math.random()*30)+'px';
    el.style.color = colors[Math.floor(Math.random()*colors.length)];
    const dur = 16+Math.random()*18;
    el.style.animationDuration = dur+'s';
    el.style.animationDelay = (-Math.random()*dur)+'s';
    wrap.appendChild(el);
  }
})();

/* ---------------- sound ---------------- */
let audioCtx;
function ctx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, start, dur, type='sine', vol=.18){
  const c = ctx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g); g.connect(c.destination);
  const t0 = c.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0+.01);
  g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  o.start(t0); o.stop(t0+dur+.02);
}
function playClick(mark){
  tone(mark==='X'?520:400, 0, .12, 'triangle', .16);
}
function playWin(){
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f, i*.11, .28, 'sine', .17));
}
function playDraw(){
  tone(300,0,.18,'sawtooth',.1); tone(220,.12,.22,'sawtooth',.1);
}
function playMatchWin(){
  [392,523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f, i*.09, .35, 'triangle', .16));
}

/* ---------------- game state ---------------- */
const homeScreen = document.getElementById('home-screen');
const gameScreen = document.getElementById('game-screen');
const boardEl = document.getElementById('board');
const turnIndicator = document.getElementById('turnIndicator');
const scoreXVal = document.getElementById('scoreXVal');
const scoreOVal = document.getElementById('scoreOVal');
const scoreXCard = document.getElementById('score-x');
const scoreOCard = document.getElementById('score-o');
const roundToast = document.getElementById('roundToast');
const matchOverlay = document.getElementById('matchOverlay');
const matchTitle = document.getElementById('matchTitle');

const WIN_SCORE = 3;

let SIZE = 3, WIN_LEN = 3;
let board, current, cursor, active, scores;

function resetMatch(){
  scores = {X:0, O:0};
  scoreXVal.textContent = '0';
  scoreOVal.textContent = '0';
}
function newRound(size, winLen){
  if(size){ SIZE = size; WIN_LEN = winLen; }
  board = Array(SIZE*SIZE).fill(null);
  current = 'X';
  cursor = Math.floor(SIZE*SIZE/2);
  active = true;
  boardEl.className = 'board size-'+SIZE;
  boardEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
  renderBoard();
  updateTurnUI();
}
function renderBoard(){
  boardEl.innerHTML = '';
  board.forEach((val,i)=>{
    const cell = document.createElement('div');
    cell.className = 'cell'+(val?' '+val.toLowerCase():'')+(i===cursor?' cursor':'');
    if(val) cell.innerHTML = `<span class="mark">${val}</span>`;
    cell.addEventListener('click', ()=>attemptPlace(i));
    boardEl.appendChild(cell);
  });
}
function updateTurnUI(){
  turnIndicator.innerHTML = `نوبت <b class="${current.toLowerCase()}">${current}</b>`;
  scoreXCard.classList.toggle('turn-x', current==='X');
  scoreOCard.classList.toggle('turn-o', current==='O');
}
function attemptPlace(index, forcedMark){
  if(!active) return;
  if(board[index]) return;
  const mark = forcedMark || current;
  if(forcedMark && forcedMark !== current) return; // must be that player's turn
  board[index] = mark;
  playClick(mark);
  cursor = index;
  renderBoard();
  const line = getWinningLine(mark);
  if(line){
    finishRound(mark, line);
    return;
  }
  if(board.every(c=>c)){
    finishRound(null, null);
    return;
  }
  current = current === 'X' ? 'O' : 'X';
  updateTurnUI();
}
function getWinningLine(mark){
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      if(board[r*SIZE+c]!==mark) continue;
      for(const [dr,dc] of dirs){
        const line=[r*SIZE+c];
        let rr=r+dr, cc=c+dc;
        while(rr>=0&&rr<SIZE&&cc>=0&&cc<SIZE&&board[rr*SIZE+cc]===mark){
          line.push(rr*SIZE+cc);
          if(line.length>=WIN_LEN) return line;
          rr+=dr; cc+=dc;
        }
      }
    }
  }
  return null;
}
function finishRound(winner, line){
  active = false;
  if(winner){
    line.forEach(i=>{
      boardEl.children[i].classList.add('win');
    });
    scores[winner]++;
    (winner==='X'?scoreXVal:scoreOVal).textContent = scores[winner];
    playWin();
    showToast(`🎉 بازیکن ${winner} این دور را برد!`);
    if(scores[winner] >= WIN_SCORE){
      setTimeout(()=>showMatchWin(winner), 900);
      return;
    }
  } else {
    playDraw();
    showToast('🤝 این دور مساوی شد');
  }
  setTimeout(()=>{ if(!matchOverlay.classList.contains('active')) newRound(); }, 1300);
}
function showToast(msg){
  roundToast.textContent = msg;
  roundToast.classList.add('show');
  setTimeout(()=>roundToast.classList.remove('show'), 1200);
}
function showMatchWin(winner){
  matchTitle.innerHTML = `بازیکن <b class="${winner.toLowerCase()}">${winner}</b> قهرمان شد!`;
  matchOverlay.classList.add('active');
  playMatchWin();
}

/* ---------------- keyboard controls ---------------- */
function moveCursor(dr, dc){
  let r = Math.floor(cursor/SIZE), c = cursor%SIZE;
  r = (r+dr+SIZE)%SIZE; c = (c+dc+SIZE)%SIZE;
  cursor = r*SIZE+c;
  renderBoard();
}
document.addEventListener('keydown', (e)=>{
  if(!gameScreen.classList.contains('active') || !active) return;
  const k = e.key.toLowerCase();
  if(['w','a','s','d',' ','x','o'].includes(k)) e.preventDefault();
  if(k==='w') moveCursor(-1,0);
  else if(k==='s') moveCursor(1,0);
  else if(k==='a') moveCursor(0,-1);
  else if(k==='d') moveCursor(0,1);
  else if(k===' ') attemptPlace(cursor);
  else if(k==='x') attemptPlace(cursor,'X');
  else if(k==='o') attemptPlace(cursor,'O');
});

/* ---------------- navigation ---------------- */
let lastSize = 3, lastWin = 3;
document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    ctx(); // unlock audio on user gesture
    lastSize = parseInt(btn.dataset.size, 10);
    lastWin = parseInt(btn.dataset.win, 10);
    homeScreen.classList.remove('active');
    gameScreen.classList.add('active');
    resetMatch();
    newRound(lastSize, lastWin);
  });
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  newRound(lastSize, lastWin);
});
document.getElementById('endBtn').addEventListener('click', ()=>{
  gameScreen.classList.remove('active');
  matchOverlay.classList.remove('active');
  homeScreen.classList.add('active');
});
document.getElementById('homeBtn').addEventListener('click', ()=>{
  matchOverlay.classList.remove('active');
  gameScreen.classList.remove('active');
  homeScreen.classList.add('active');
});
</script>
</body>
</html>
